# === Lancelot Manifest v1 ===
# 解析器：tomllib（标准库）；写回：tomli_w（仅装配器内部使用）

[adapter]
id            = "memory.lru"
name          = "LRU Memory"
version       = "0.1.0"
category      = "memory"
description   = "进程内短期记忆，采用 LRU（最近最少使用）淘汰策略。容量满时优先淘汰最久未访问的条目。V1 演示与 composition 兼容性测试用。"
min_framework = "1.0.0"

[entry]
module  = "memory.lru"
factory = "create_memory"

[capabilities]
provides = ["MemoryPort"]
requires = []
conflicts = []
enhances = []

[config]
schema = { max_entries = { type = "int", default = 512, required = false } }
